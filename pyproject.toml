[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backend-ai"
version = "0.1.0"
description = "Backend AI service for document OCR, NER, and PII detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "paddleocr>=2.7,<3.0",
    "paddlepaddle>=2.6,<3.0",
    "pytesseract>=0.3.10",
    "spacy>=3.7.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
